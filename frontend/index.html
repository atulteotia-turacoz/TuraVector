<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TuraVector</title>
    <meta name="description" content="TuraVector — document management, review and research workspace." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
    <script>
      try {
        var m = localStorage.getItem('tura.theme'), a = localStorage.getItem('tura.accent'), c = localStorage.getItem('tura.accent.custom');
        if (m && m !== 'system') document.documentElement.setAttribute('data-theme', m);
        if (a) document.documentElement.setAttribute('data-accent', a);
        if (a === 'custom' && c) document.documentElement.style.setProperty('--accent-custom', c);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
